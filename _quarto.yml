project:
  type: website
  output-dir: docs

website:
  title: "Palette Jack"
  description: "Copy-able hex color palettes for R -- Werner, Wada, Woods Hole, and Oceanography."
  site-url: "https://shu251.github.io/palette-jack"
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - href: werner/index.qmd
        text: Werner
      - href: wada/index.qmd
        text: Wada
      - href: woods-hole/index.qmd
        text: "Woods Hole"
      - href: oceanography/index.qmd
        text: "Oceanography"
    tools:
      - icon: github
        href: https://github.com/shu251/palette-jack
        aria-label: GitHub
  page-footer:
    center: "Built with Quarto + Observable JS. Color data cited on each mode's page."

format:
  html:
    theme: [cosmo, brand, styles.scss]
    toc: false
    fontsize: 1.05rem
    linestretch: 1.6
    grid:
      body-width: 900px

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
